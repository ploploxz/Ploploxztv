<!DOCTYPE html>
<html lang="es">
<head>
 <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#141414">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ploploxz</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#141414;color:#fff}
.header{display:none}
.logo{
font-size:24px;
font-weight:700;
color:#e50914;
}

.hero{
position:relative;
height:750px;
background-size:cover;
background-position:center;
display:flex;
align-items:flex-end;
padding:30px;
}

.hero-overlay{
position:absolute;
inset:0;
background:linear-gradient(to top,#141414 5%,rgba(20,20,20,.1) 50%,rgba(20,20,20,.6) 100%);
}
.hero-content{position:relative;z-index:2;max-width:700px}
.hero-content h1{font-size:36px;margin-bottom:12px}
.hero-content p{max-width:600px;opacity:.9;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;line-clamp: 3;-webkit-box-orient:vertical;overflow:hidden}
.hero-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.hero-buttons button{border:none;padding:8px 16px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
#hero-play{background:#e50914;color:white}
#home-content{padding-bottom:50px}
.row-section{margin-top:30px}
.row-section h2{padding:0 20px;margin-bottom:12px;font-size:22px}
.row-posters{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;padding:0 15px}
.row-posters::-webkit-scrollbar,.continue-row::-webkit-scrollbar{display:none}
.card{flex:none;width:110px;text-decoration:none;color:white;transition:.3s;position:relative}
.card:hover{transform:scale(1.08)}
.card img{width:100%;border-radius:8px;display:block;aspect-ratio:2/3;object-fit:cover}
.card span{display:-webkit-box;-webkit-line-clamp:3;line-clamp: 3;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px;font-size:14px;text-align:center;line-height:1.3;height:54px}
.card-info{position:absolute;top:6px;left:6px;z-index:2;margin:0;min-height:0;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:2px;pointer-events:none}
.card-type,.card-status{display:inline-block;width:auto;max-width:98px;margin:0;padding:3px 5px;border-radius:4px;background:rgba(0,0,0,.72);font-size:8px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-type{color:#fff}
.card-status.ongoing{color:#fff;background:rgba(229,9,20,.9)}
.card-status.completed{color:#fff;background:rgba(60,60,60,.9)}
.section-title{display:flex;justify-content:space-between;align-items:center;padding:0 20px;margin-bottom:12px}
.see-more{color:#e50914;text-decoration:none;font-size:14px;font-weight:600}
.continue-section{margin-top:30px}
.continue-section h2{padding:0 20px;margin-bottom:12px;font-size:22px}
.continue-row{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;padding:0 15px}
.continue-card{flex:none;width:280px;height:125px;display:flex;background:#222;border-radius:9px;overflow:hidden;text-decoration:none;color:#fff;position:relative;transition:.3s}
.continue-card:hover{transform:scale(1.03)}
.continue-poster{width:90px;height:125px;flex:none;object-fit:cover;background:#333}
.continue-info{min-width:0;flex:1;padding:10px;display:flex;flex-direction:column;justify-content:center}
.continue-title{font-size:15px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;line-clamp: 2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.continue-episode{margin-top:5px;font-size:12px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.continue-time{margin-top:7px;font-size:12px;color:#aaa}
.continue-progress{position:absolute;left:90px;right:0;bottom:0;height:4px;background:#444}
.continue-progress-bar{height:100%;background:#e50914}
.continue-play{position:absolute;right:9px;top:9px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e50914;font-size:13px}
@media(max-width:600px){.continue-card{width:270px}}
</style>
</head>
<body>
<header class="header"><div class="logo">Ploploxz</div></header>
<section class="hero" id="hero"><div class="hero-overlay"></div><div class="hero-content">
<h1 id="hero-title">Cargando...</h1>
<p id="hero-description">Preparando contenido...</p>
<div class="hero-buttons"><button id="hero-play">▶ Ver ahora</button><button id="favorites-btn">➕ Mi Lista</button><button id="donate-btn">❤️ Donar</button></div>
</div></section>
<main id="home-content"></main>
<script>
const GENRES={28:"Acción",12:"Aventura",35:"Comedia",80:"Crimen",99:"Documental",18:"Drama",10751:"Familia",14:"Fantasía",36:"Historia",27:"Terror",10402:"Música",9648:"Misterio",10749:"Romance",878:"Ciencia Ficción",10770:"TV Movie",53:"Suspenso",10752:"Guerra",37:"Western",10765:"Fantasía y ciencia ficción",10759:"Acción y aventura"};
const BLOG_ID="5683541567308872996";
const API_KEY="AIzaSyCAvJmJljHNtxtP1GFairfwktCj71nSt1Q";

function shuffle (array) {return array.sort(()=>Math.random()-.5)}

/* Lee todas las páginas de Blogger, no solo la primera tanda de publicaciones. */
async function obtenerTodasLasEntradasBlogger(){
 const todas=[];
 let pageToken="";
 do{
  const params=new URLSearchParams({key:API_KEY,maxResults:"100"});
  if(pageToken)params.set("pageToken",pageToken);
  const response=await fetch(`https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts?${params.toString()}`);
  if(!response.ok){
   let detalle="";
   try{const err=await response.json();detalle=err.error?.message||""}catch(e){}
   throw new Error(`Error de Blogger (${response.status})${detalle?": "+detalle:""}`);
  }
  const data=await response.json();
  if(data.error)throw new Error(data.error.message||"Blogger devolvió un error.");
  todas.push(...(data.items||[]));
  pageToken=data.nextPageToken||"";
 }while(pageToken);
 return todas;
}
function normalizarTipo(tipo){
 const t=String(tipo||"").toLowerCase();
 if(["tv","serie","series","anime"].includes(t))return "tv";
 if(["movie","pelicula","película","film"].includes(t))return "movie";
 return t;
}
function esEntradaCatalogo(post){
 const t=String(post.title||"").trim();
 return /^(catalogo-json|series-json)$/i.test(t) ||
        /^anime\..+-json$/i.test(t) ||
        /^pel[ií]cula\..+-json$/i.test(t);
}
function extraerDatosDeEntrada(post){
 const doc=new DOMParser().parseFromString(post.content||"","text/html");
 const datos=[];
 ["catalogo-data","series-data","anime-data"].forEach(id=>{
  const node=doc.getElementById(id);
  if(node){
   try{datos.push(JSON.parse(node.textContent.trim()))}catch(e){console.warn("JSON inválido en",post.title,"#",id,e)}
  }
 });
 if(!datos.length){
  doc.querySelectorAll("pre,script[type='application/json']").forEach(node=>{
   try{datos.push(JSON.parse(node.textContent.trim()))}catch(e){}
  });
 }
 const resultado=[];
 datos.forEach(valor=>{
  if(Array.isArray(valor))resultado.push(...valor);
  else if(valor&&typeof valor==="object"){
   if(Array.isArray(valor.items))resultado.push(...valor.items);
   else if(Array.isArray(valor.data))resultado.push(...valor.data);
   else if(valor.id!=null)resultado.push(valor);
  }
 });
 return resultado;
}
async function loadHome(){
 const home=document.getElementById("home-content");
 home.innerHTML='<p style="padding:24px;color:#bbb">Cargando catálogo de Ploploxz...</p>';
 try{
  const posts=await obtenerTodasLasEntradasBlogger();
  const entradas=posts.filter(esEntradaCatalogo);
  if(!entradas.length)throw new Error("No se encontraron las entradas catalogo-json, series-json ni las entradas individuales anime.nombre-json / pelicula.nombre-json.");

  const catalogo=[];
  const errores=[];
  for(const post of entradas){
   const nombre=String(post.title||"").trim();
   let tipoEntrada="";
   if(/^anime\./i.test(nombre)||/^series-json$/i.test(nombre))tipoEntrada="tv";
   if(/^pel[ií]cula\./i.test(nombre)||/^catalogo-json$/i.test(nombre))tipoEntrada="movie";
   try{
    const items=extraerDatosDeEntrada(post);
    if(!items.length)throw new Error("No se encontró un array JSON válido dentro de la entrada.");
    items.forEach(original=>{
     if(!original||typeof original!=="object")return;
     const item={...original};
     item.type=normalizarTipo(item.type||tipoEntrada);
     if(/^anime\./i.test(nombre))item.anime=true;
     if(item.id==null||!item.title){
      errores.push(`${nombre}: hay un elemento sin id o title`);
      return;
     }
     item.genres=Array.isArray(item.genres)?item.genres.map(Number):[];
     catalogo.push(item);
    });
   }catch(error){
    errores.push(`${nombre}: ${error.message}`);
    console.warn("No se pudo leer la entrada",nombre,error);
   }
  }
  /* Si una entrada individual y el catálogo antiguo contienen el mismo título,
     el registro de la entrada individual tiene prioridad. */
  const unicos=new Map();
  catalogo.forEach(item=>{
   const key=`${normalizarTipo(item.type)}_${String(item.id)}`;
   if(!unicos.has(key)||/^(anime|pel[ií]cula)\./i.test(String(item._sourceTitle||"")))unicos.set(key,item);
   else unicos.set(key,item);
  });
  const catalogoFinal=Array.from(unicos.values());
  if(!catalogoFinal.length){
   const extra=errores.length?` Detalles: ${errores.slice(0,3).join(" | ")}`:"";
   throw new Error("Se encontraron entradas, pero no se pudo leer ningún elemento. Comprueba que el JSON esté dentro de <pre id=\"series-data\"> para animes o <pre id=\"catalogo-data\"> para películas."+extra);
  }
  const series=catalogoFinal.filter(item=>normalizarTipo(item.type)==="tv");
  catalogoFinal.forEach(item=>item.type=normalizarTipo(item.type));
  buildHome(catalogoFinal,series);
  console.info(`Ploploxz: ${catalogoFinal.length} contenidos leídos desde ${entradas.length} entradas Blogger.`);
  if(errores.length)console.warn("Algunas entradas se omitieron:",errores);
 }catch(error){
  console.error("Error cargando Ploploxz:",error);
  home.innerHTML=`<div style="padding:24px;color:#ffb3b3;line-height:1.6">No se pudo cargar el catálogo.<br>${String(error.message||error)}<br><button onclick="loadHome()" style="margin-top:14px;padding:10px 16px;border:0;border-radius:6px;background:#e50914;color:white">Reintentar</button></div>`;
 }
}

function obtenerClaveActualizacionSerie(item){
 const ultimo=obtenerUltimoEpisodio(item);
 if(!ultimo)return "T0 E0";
 return `T${ultimo.season} E${ultimo.episode}`;
}
function obtenerFechaActualizacionSerie(item){
 const claveActual=obtenerClaveActualizacionSerie(item);
 const storageKey=`ploploxz_serie_update_${item.id}`;
 const guardado=localStorage.getItem(storageKey);
 if(!guardado){localStorage.setItem(storageKey,JSON.stringify({clave:claveActual,fecha:0}));return 0;}
 try{
  const datos=JSON.parse(guardado);
  if(datos.clave!==claveActual){const fecha=Date.now();localStorage.setItem(storageKey,JSON.stringify({clave:claveActual,fecha}));return fecha;}
  return Number(datos.fecha)||0;
 }catch(error){localStorage.setItem(storageKey,JSON.stringify({clave:claveActual,fecha:0}));return 0;}
}
function buildHome(catalog,series){
 buildHero(catalog);
 const home=document.getElementById("home-content");
 let html="";
 html+=buildContinueWatching(catalog,series);
 const recentItems=[...catalog].filter(item=>item.created||item.type==="tv").map(item=>{
  if(item.type==="tv")return {...item,_ploploxzUpdate:obtenerFechaActualizacionSerie(item)};
  return item;
 }).sort((a,b)=>{
  const fechaA=a.type==="tv"&&a._ploploxzUpdate?Number(a._ploploxzUpdate):new Date(a.created||0).getTime();
  const fechaB=b.type==="tv"&&b._ploploxzUpdate?Number(b._ploploxzUpdate):new Date(b.created||0).getTime();
  return fechaB-fechaA;
 }).slice(0,10);
 html+=createSection("Agregados recientemente",recentItems);
 const popularItems=[...catalog].filter(item=>item.rating).sort((a,b)=>b.rating-a.rating).slice(0,20);
 html+=createSection("🔥 Más populares",popularItems);
 html+=createSection("Películas",shuffle(catalog.filter(item=>item.type==="movie")),{type:"movie"});
 html+=createSection("Series",shuffle(catalog.filter(item=>item.type==="tv"&&!item.anime)),{type:"tv"});
 html+=createSection("🎌 series",shuffle(catalog.filter(item=>item.anime)),{type:"anime"});
 Object.entries(GENRES).forEach(([id,name])=>{
  const items=shuffle(catalog.filter(item=>item.genres&&item.genres.includes(Number(id))));
  html+=createSection(name,items,{type:"genre",value:Number(id),title:name});
 });
 home.innerHTML=html;
 lazyImages();
}
function obtenerUltimoEpisodio(item){
 if(!Array.isArray(item.seasons))return null;
 let ultima=null;
 item.seasons.forEach(season=>{if(!season||!Array.isArray(season.episodes)||!season.episodes.length)return;if(!ultima||Number(season.season)>Number(ultima.season))ultima=season;});
 if(!ultima)return null;
 const episodio=ultima.episodes.reduce((a,e)=>!a||Number(e.episode)>Number(a.episode)?e:a,null);
 return episodio?{season:Number(ultima.season),episode:Number(episodio.episode)}:null;
}
function obtenerInfoCard(item){
 if(item.type==="movie")return{type:"🎬 Película",status:"",statusClass:""};
 if(item.type==="tv"){
  const ultimo=obtenerUltimoEpisodio(item);
  const temporadas=Array.isArray(item.seasons)?item.seasons.filter(s=>Array.isArray(s.episodes)&&s.episodes.length).length:0;
  let type="📺 Serie";
  if(ultimo)type+=` · T${ultimo.season} E${ultimo.episode}`;
  else if(temporadas)type+=` · ${temporadas} temporada${temporadas!==1?"s":""}`;
  const completed=item.status==="completed";
  return{type,status:completed?"✓ Terminada":"🔴 En emisión",statusClass:completed?"completed":"ongoing"};
 }
 return{type:"Contenido",status:"",statusClass:""};
}
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));}
function createCard(item){
 const info=obtenerInfoCard(item);
 const selected=JSON.stringify({id:item.id,type:item.type}).replace(/</g,"\\u003c");
 const poster=escapeHTML(item.poster||item.backdrop||"https://via.placeholder.com/300x450/222/fff?text=Ploploxz");
 return `<a href="detalle.html" class="card" onclick='localStorage.setItem("selectedContent",${JSON.stringify(selected)})'>
 <img src="https://via.placeholder.com/300x450/222/fff?text=Ploploxz" data-src="${poster}" loading="lazy" alt="${escapeHTML(item.title)}">
 <span>${escapeHTML(item.title)}</span>
 <div class="card-info"><div class="card-type">${escapeHTML(info.type)}</div>${info.status?`<div class="card-status ${info.statusClass}">${info.status}</div>`:""}</div>
 </a>`;
}
function createSection(title,items,filtro=null){
 if(!items.length)return ""; const verMas=filtro?`<a href="vermas.html" class="see-more"
 onclick='localStorage.setItem("explorarFiltro",JSON.stringify(${JSON.stringify(filtro)}))'>Ver más</a>`:"";
 return `<section class="row-section"><h2 class="section-title"><span>${title}</span>${verMas}</h2><div class="row-posters">${items.slice(0,10).map(createCard).join("")}</div></section>`;
}
function buildContinueWatching(catalog,series){
 const progressItems=[];
 for(let i=0;i<localStorage.length;i++){
  const key=localStorage.key(i);
  if(!key||!key.startsWith("pelicula_")||key.endsWith("_lastViewed"))continue;
  const videoURL=key.substring("pelicula_".length);
  const savedTime=Number(localStorage.getItem(key));
  if(!videoURL||!isFinite(savedTime)||savedTime<=0)continue;
  const lastViewed=Number(localStorage.getItem(key+"_lastViewed"))||0;
  const movie=catalog.find(item=>item.type==="movie"&&item.videoUrl===videoURL);
  if(movie){progressItems.push({groupKey:"movie_"+movie.id,content:movie,videoURL,time:savedTime,lastViewed,isEpisode:false,season:null,episode:null,episodeTitle:null});continue}
  let found=null;
  for(const serie of series){
   if(!Array.isArray(serie.seasons))continue;
   for(const season of serie.seasons){
    for(const episode of season.episodes||[]){
     if(episode.videoUrl===videoURL){found={serie,season:Number(season.season),episode:Number(episode.episode),episodeTitle:episode.title||`Episodio ${episode.episode}`,videoURL};break;}
    }
    if(found)break;
   }
   if(found)break;
  }
  if(found)progressItems.push({groupKey:"serie_"+found.serie.id,content:found.serie,videoURL:found.videoURL,time:savedTime,lastViewed,isEpisode:true,season:found.season,episode:found.episode,episodeTitle:found.episodeTitle});
 }
 const latest={};
 progressItems.forEach(item=>{if(!latest[item.groupKey]||item.lastViewed>latest[item.groupKey].lastViewed)latest[item.groupKey]=item;});
 const items=Object.values(latest).sort((a,b)=>b.lastViewed-a.lastViewed).slice(0,10);
 if(!items.length)return "";
 return `<section class="continue-section"><h2>Continuar viendo</h2><div class="continue-row">${items.map(createContinueCard).join("")}</div></section>`;
}
function createContinueCard(item){
 const content=item.content,poster=content.poster||content.backdrop||"";
 const playerType=item.isEpisode?"episodico":"pelicula";
 return `<a href="player.html" class="continue-card" onclick='
 localStorage.setItem("videoURL",${JSON.stringify(item.videoURL)});
 localStorage.setItem("posterURL",${JSON.stringify(poster)});
 localStorage.setItem("tipoContenido",${JSON.stringify(playerType)});
 ${item.isEpisode?`
 localStorage.setItem("serieId",${JSON.stringify(String(content.id))});
 localStorage.setItem("serieData",${JSON.stringify(JSON.stringify(content))});
 localStorage.setItem("temporadaActual",${JSON.stringify(String(item.season))});
 localStorage.setItem("episodioActual",${JSON.stringify(String(item.episode))});
 `:`
 localStorage.removeItem("serieId");localStorage.removeItem("serieData");localStorage.removeItem("temporadaActual");localStorage.removeItem("episodioActual");
 `}'>
 <img class="continue-poster" src="${poster||"https://via.placeholder.com/300x450/222/fff?text=Ploploxz"}" alt="${escapeHTML(content.title)}">
 <div class="continue-info"><div class="continue-title">${escapeHTML(content.title)}</div>${item.isEpisode?`<div class="continue-episode">T${item.season} • Episodio ${item.episode}${item.episodeTitle?` · ${escapeHTML(item.episodeTitle)}`:""}</div>`:""}<div class="continue-time">▶ ${formatTime(item.time)}</div></div>
 <div class="continue-play">▶</div><div class="continue-progress"><div class="continue-progress-bar" style="width:0%"></div></div>
 </a>`;
}
function formatTime(seconds){
 if(!isFinite(seconds))return "0:00";
 const hours=Math.floor(seconds/3600),minutes=Math.floor((seconds%3600)/60),secondsLeft=Math.floor(seconds%60);
 return hours>0?hours+":"+String(minutes).padStart(2,"0")+":"+String(secondsLeft).padStart(2,"0"):minutes+":"+String(secondsLeft).padStart(2,"0");
}
function buildHero(catalog){
 if(!catalog.length)return;
 const featured=catalog[Math.floor(Math.random()*catalog.length)];
 const hero=document.getElementById("hero");
 hero.style.backgroundImage=`url('${featured.backdrop||featured.poster||""}')`;
 document.getElementById("hero-title").textContent=featured.title;
 document.getElementById("hero-description").textContent=featured.overview||"Disponible ahora en Ploplox";
 document.getElementById("hero-play").onclick=()=>{
  localStorage.setItem("selectedContent",JSON.stringify({id:featured.id,type:featured.type}));
alert(new URL("detalle.html", location.href).href);
 };
}
document.getElementById("donate-btn").onclick=()=>location.href="donar.html";

document.getElementById("favorites-btn").onclick=()=>location.href="favoritos.html";
function lazyImages(){
 const images=document.querySelectorAll("img[data-src]");
 if(!("IntersectionObserver" in window)){images.forEach(img=>{img.src=img.dataset.src;img.removeAttribute("data-src");});return;}
 const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){const img=entry.target;img.src=img.dataset.src;img.removeAttribute("data-src");observer.unobserve(img);}});});
 images.forEach(img=>observer.observe(img));
}
document.addEventListener("DOMContentLoaded",loadHome);
</script>
</body>
</html>
