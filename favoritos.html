<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Lista - Ploploxz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#141414;
  color:#fff;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:#141414;
  padding:20px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.header h1{
  font-size:28px;
}

.container{
  padding:20px;
}

.favorites-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:16px;
}

.card{
  position:relative;
  text-decoration:none;
  color:white;
}

.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:10px;
}

.card span{
  display:block;
  margin-top:8px;
  text-align:center;
  font-size:14px;
}

.remove-btn{
  position:absolute;
  top:8px;
  right:8px;
  width:30px;
  height:30px;
  border:none;
  border-radius:50%;
  background:rgba(0,0,0,.85);
  color:white;
  font-size:16px;
  cursor:pointer;
}

.empty-state{
  text-align:center;
  padding:80px 20px;
}

.empty-state h2{
  margin-bottom:10px;
}

.empty-state p{
  opacity:.7;
}

</style>
</head>
<body>

<header class="header">
  <h1>❤️ Mi Lista</h1>
</header>

<div class="container">

  <div
    id="favoritesContainer"
    class="favorites-grid">
  </div>

</div>

<script>

function getFavorites(){

  return JSON.parse(
    localStorage.getItem("favorites")
  ) || [];

}

function removeFavorite(id){

  let favorites =
    getFavorites();

  favorites =
    favorites.filter(
      item => item.id != id
    );

  localStorage.setItem(
    "favorites",
    JSON.stringify(favorites)
  );

  loadFavorites();

}

function loadFavorites(){

  const favorites =
    getFavorites();

  const container =
    document.getElementById(
      "favoritesContainer"
    );

  if(!favorites.length){

    container.className = "";

    container.innerHTML = `

      <div class="empty-state">

        <h2>
          Tu lista está vacía
        </h2>

        <p>
          Agrega películas o series
          desde la página de detalle.
        </p>

      </div>

    `;

    return;

  }

  container.className =
    "favorites-grid";

  container.innerHTML =
    favorites.map(item => `

      <a
      href="go:detalle"
      class="card"

      onclick='localStorage.setItem(
        "selectedContent",
        JSON.stringify({
          id:${item.id},
          type:"${item.type}"
        })
      )'>

        <button
        class="remove-btn"

        onclick="
        event.preventDefault();
        event.stopPropagation();
        removeFavorite(${item.id});
        ">

        ✕

        </button>

        <img
        src="${item.poster}"
        alt="${item.title}">

        <span>
          ${item.title}
        </span>

      </a>

    `).join("");

}

document.addEventListener(
  "DOMContentLoaded",
  loadFavorites
);

</script>

</body>
</html>
