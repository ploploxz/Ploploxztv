<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explorar - Ploploxz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#141414;
  color:white;
}

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#141414;
  padding:20px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.header h1{
  font-size:28px;
}

.grid{
  padding:15px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  
}

.card{
  text-decoration:none;
  color:white;
  transition:.3s;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:8px;
}


.card span{
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;

  margin-top:6px;
  font-size:14px;
  text-align:center;
  line-height:1.3;

  height:54px;
}

.loading{
  padding:40px;
  text-align:center;
  font-size:18px;
}

</style>
</head>
<body>

<header class="header">
  <h1 id="pageTitle">Explorar</h1>
</header>

<div id="results" class="grid"></div>

<script>

const BLOG_ID = "5683541567308872996";
const API_KEY = "AIzaSyCAvJmJljHNtxtP1GFairfwktCj71nSt1Q";

const GENRES = {
  28:"Acción",
  12:"Aventura",
  16:"Animación",
  35:"Comedia",
  80:"Crimen",
  99:"Documental",
  18:"Drama",
  10751:"Familia",
  14:"Fantasía",
  36:"Historia",
  27:"Terror",
  10402:"Música",
  9648:"Misterio",
  10749:"Romance",
  878:"Ciencia Ficción",
  10770:"TV Movie",
  53:"Suspenso",
  10752:"Guerra",
  37:"Western"
};

async function loadCatalog() {
  const resultsElement = document.getElementById("results");

  resultsElement.innerHTML =
    '<div class="loading">Cargando catálogo de Ploploxz...</div>';

  try {
    const catalog = [];
    const vistos = new Set();

    let pageToken = "";

    // Leer todas las páginas de entradas de Blogger.
    do {
      const params = new URLSearchParams({
        key: API_KEY,
        maxResults: "100",
        fetchBodies: "true"
      });

      if (pageToken) {
        params.set("pageToken", pageToken);
      }

      const response = await fetch(
        `https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts?${params}`
      );

      if (!response.ok) {
        throw new Error(
          `Error al consultar Blogger: ${response.status}`
        );
      }

      const data = await response.json();

      // Recorrer todas las entradas recibidas.
      for (const post of data.items || []) {
        if (!post.content) continue;

        const doc = new DOMParser().parseFromString(
          post.content,
          "text/html"
        );

        const elementos = [];

        // Formatos utilizados por los catálogos originales.
        doc.querySelectorAll(
          "#catalogo-data, #series-data"
        ).forEach(el => elementos.push(el));

        // Formatos utilizados en las nuevas entradas de anime.
        doc.querySelectorAll(
          "pre, script, code"
        ).forEach(el => {
          if (!elementos.includes(el)) {
            elementos.push(el);
          }
        });

        for (const elemento of elementos) {
          const texto = elemento.textContent.trim();

          // Este formato espera un array JSON.
          if (!texto.startsWith("[")) continue;

          let contenidos;

          try {
            contenidos = JSON.parse(texto);
          } catch (error) {
            console.warn(
              "No se pudo leer el JSON de la entrada:",
              post.title,
              error
            );
            continue;
          }

          if (!Array.isArray(contenidos)) continue;

          for (const item of contenidos) {
            if (
              !item ||
              item.id == null ||
              !["movie", "tv"].includes(item.type)
            ) {
              continue;
            }

            // Evitar mostrar duplicados.
            const clave = `${item.type}_${item.id}`;

            if (vistos.has(clave)) continue;

            vistos.add(clave);
            catalog.push(item);
          }
        }
      }

      pageToken = data.nextPageToken || "";

    } while (pageToken);

    if (!catalog.length) {
      throw new Error(
        "No se encontraron contenidos. Comprueba el formato JSON de las entradas."
      );
    }

    console.log(
      "Catálogo cargado:",
      catalog.length,
      "contenidos"
    );

    // Mantener los filtros que utiliza el Home.
    applyFilters(catalog);

  } catch (error) {
    console.error("Error cargando el catálogo:", error);

    resultsElement.innerHTML = `
      <div class="loading">
        No se pudo cargar el catálogo.<br>
        ${error.message}
      </div>
    `;
  }
}

function applyFilters(catalog){

  const filtro = JSON.parse(
    localStorage.getItem("explorarFiltro")
  );

  const pageTitle =
    document.getElementById("pageTitle");

  let results = [...catalog];

  if(!filtro){

    pageTitle.textContent = "Explorar";

    renderResults(results);

    return;

  }

  if(filtro.type === "movie"){

    results = results.filter(
      item => item.type === "movie"
    );

    pageTitle.textContent =
      "🎬 Películas";

  }

  if(filtro.type === "tv"){

    results = results.filter(
      item => item.type === "tv"
&& !item.anime
    );

    pageTitle.textContent =
      "📺 Series";

  }

  if(filtro.type === "anime"){

    results = results.filter(
      item => item.anime
    );

    pageTitle.textContent =
      "🎌 Anime";

  }

  if(filtro.type === "genre"){

    results = results.filter(item =>
      item.genres &&
      item.genres.includes(
        Number(filtro.value)
      )
    );

    pageTitle.textContent =
      filtro.title;

  }

  renderResults(results);

}

function renderResults(items){

  const results =
    document.getElementById("results");

  if(!items.length){

    results.innerHTML = `
      <div class="loading">
        No se encontraron resultados
      </div>
    `;

    return;

  }

  results.innerHTML =
  items.map(item => `
    <a href="go:detalle"
       class="card"

       onclick='localStorage.setItem(
         "selectedContent",
         JSON.stringify({
           id:${item.id},
           type:"${item.type}"
         })
       )'>

      <img
        src="${item.poster}"
        alt="${item.title}"
      >

      <span>
        ${item.title}
      </span>

    </a>
  `).join("");

}



document.addEventListener(
  "DOMContentLoaded",
  loadCatalog
);

</script>

</body>
</html>
