<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ploploxz Player</title>
<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

button{
  -webkit-tap-highlight-color:transparent;
  transition:background .2s ease,transform .2s ease,opacity .2s ease;
}

button:active{
  transform:scale(.90);
}

#player{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
  touch-action:none;
}

#video{
  width:100%;
  height:100%;
  display:block;
  background:#000;
  object-fit:contain;
}

#embedFrame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#000;
  display:none;
}

/* BARRA INFERIOR */

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:10;
  padding:35px 18px 18px;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.55) 25%,
    rgba(0,0,0,.94)
  );
  transition:opacity .25s ease;
}

#controls.hidden{
  opacity:0;
  pointer-events:none;
}

/* PROGRESO */

#progressContainer{
  position:relative;
  width:100%;
  height:5px;
  background:rgba(255,255,255,.30);
  cursor:pointer;
  margin-bottom:15px;
  border-radius:10px;
  touch-action:none;
  transition:height .2s ease;
}

#progressContainer:active{
  height:8px;
}

#progress{
  position:absolute;
  left:0;
  top:0;
  width:0;
  height:100%;
  background:#ed1c24;
  border-radius:10px;
  box-shadow:0 0 9px rgba(237,28,36,.5);
}

#progressThumb{
  position:absolute;
  top:50%;
  left:0;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#fff;
  transform:translate(-50%,-50%);
  box-shadow:0 1px 7px rgba(0,0,0,.7);
  pointer-events:none;
}

/* CONTROLES INFERIORES */

.control-row{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
}

.control-row button{
  border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.10);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#fff;
  font-size:17px;
  cursor:pointer;
  width:39px;
  height:39px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  flex:none;
}

.control-row button:hover{
  background:rgba(255,255,255,.23);
}

#play{
  background:#ed1c24;
  border-color:#ed1c24;
  font-size:16px;
}

#play:hover{
  background:#ff3038;
}

#current,#duration{
  color:#fff;
  font-family:Arial,sans-serif;
  font-size:12px;
  white-space:nowrap;
  opacity:.9;
}

.time-separator{
  color:rgba(255,255,255,.55);
  font-size:12px;
  margin:0 -7px;
}

.volume-group{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:auto;
}

#volume{
  width:75px;
  height:4px;
  accent-color:#ed1c24;
  cursor:pointer;
  touch-action:auto;
}

#fullscreen{
  margin-left:2px;
}

/* BOTONES CENTRALES */

#centerControls{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:32px;
  transition:opacity .25s ease;
}

#centerControls.hidden{
  opacity:0;
  pointer-events:none;
}

#centerControls button{
  width:58px;
  height:58px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:50%;
  background:rgba(20,20,20,.65);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(0,0,0,.35);
}

#centerControls button:hover{
  background:rgba(255,255,255,.20);
  transform:scale(1.08);
}

#centerPlay{
  width:76px!important;
  height:76px!important;
  background:#ed1c24!important;
  border:0!important;
  font-size:29px!important;
  box-shadow:0 4px 25px rgba(237,28,36,.35)!important;
}

#centerPlay:hover{
  background:#ff3038!important;
}

/* INDICADORES DE ADELANTO */

.seek-indicator{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:25;
  color:#fff;
  font-family:Arial,sans-serif;
  font-size:18px;
  font-weight:bold;
  opacity:0;
  pointer-events:none;
}

#seekLeft{left:18%}
#seekRight{right:18%}

.seek-indicator.show{
  animation:seekAnimation .6s ease;
}

@keyframes seekAnimation{
  0%{opacity:0;transform:translateY(-50%) scale(.8)}
  30%{opacity:1;transform:translateY(-50%) scale(1)}
  100%{opacity:0;transform:translateY(-50%) scale(1.1)}
}

/* PANTALLA FINAL */

#endMessage{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(5px);
  color:#fff;
  font-family:Arial,sans-serif;
  z-index:30;
}

#endMessage.show{
  display:flex;
}

.end-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:17px;
  padding:25px;
  text-align:center;
}

.end-title{
  font-size:25px;
  font-weight:bold;
}

#replayButton,#nextEpisodeButton{
  width:auto;
  height:auto;
  padding:13px 23px;
  border:0;
  border-radius:30px;
  background:#ed1c24;
  color:#fff;
  font-size:14px;
  font-weight:bold;
  font-family:Arial;
  cursor:pointer;
  box-shadow:0 4px 16px rgba(237,28,36,.25);
}

#nextEpisodeButton{
  display:none;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.3);
}

#replayButton:hover,#nextEpisodeButton:hover{
  transform:scale(1.04);
}

/* SIGUIENTE EPISODIO Y REPETIR */

#nearEndButtons{
  position:absolute;
  right:18px;
  bottom:90px;
  z-index:28;
  display:none;
  flex-direction:column;
  align-items:flex-end;
  gap:10px;
}

#nearEndButtons.show{
  display:flex;
}

#nearEndButtons button{
  padding:12px 17px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:25px;
  background:rgba(20,20,20,.85);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#fff;
  font-family:Arial,sans-serif;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.4);
}

#nearEndButtons button:hover{
  background:#ed1c24;
  border-color:#ed1c24;
}

#nearEndButtons #nearNext{
  display:none;
}

/* POSTER Y CARGA */

#posterPreload{
  position:absolute;
  inset:0;
  z-index:15;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000 center center / cover no-repeat;
  opacity:1;
  visibility:visible;
  transition:opacity .45s ease,visibility .45s ease;
}

#posterPreload.hidden{
  visibility:hidden;
}

#posterPreload::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    rgba(0,0,0,.18),
    rgba(0,0,0,.55)
  );
}

#posterPreloadSpinner{
  position:relative;
  z-index:2;
  width:38px;
  height:38px;
  border:3px solid rgba(255,255,255,.3);
  border-top-color:#ed1c24;
  border-radius:50%;
  animation:posterSpin .8s linear infinite;
}

@keyframes posterSpin{
  to{transform:rotate(360deg)}
}

/* BARRA SUPERIOR */

#topBar{
  position:absolute;
  left:0;
  right:0;
  top:0;
  z-index:22;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  padding:18px 18px 55px;
  background:linear-gradient(
    rgba(0,0,0,.82),
    transparent
  );
  transition:opacity .25s ease;
}

#topBar.hidden{
  opacity:0;
  pointer-events:none;
}

#topInfo{
  display:flex;
  align-items:flex-start;
  gap:12px;
  min-width:0;
}

#backButton,#topActions button{
  border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  color:#fff;
  width:40px;
  height:40px;
  border-radius:50%;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  text-shadow:0 1px 5px rgba(0,0,0,.8);
}

#backButton{
  font-size:21px;
}

#topActions{
  display:flex;
  align-items:center;
  gap:8px;
}

#topActions button:hover,#backButton:hover{
  background:rgba(255,255,255,.2);
}

#topActions svg{
  width:21px;
  height:21px;
  fill:currentColor;
}

#episodeInfo{
  min-width:0;
  max-width:min(65vw,560px);
  padding-top:2px;
}

#contentTitle{
  font-family:Arial,sans-serif;
  font-size:21px;
  font-weight:700;
  color:#fff!important;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 1px 5px rgba(0,0,0,.8);
}

#episodeTitle{
  margin-top:4px;
  font-family:Arial,sans-serif;
  font-size:14px;
  font-weight:600;
  color:rgba(255,255,255,.78)!important;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 1px 5px rgba(0,0,0,.8);
}

#pipButton.unsupported,#castButton.unsupported{
  display:none;
}

/* SALTAR INTRO */

#skipIntro{
  position:absolute;
  right:18px;
  bottom:95px;
  z-index:27;
  border:1px solid rgba(255,255,255,.25);
  border-radius:25px;
  padding:12px 18px;
  background:rgba(20,20,20,.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#fff;
  font:bold 14px Arial,sans-serif;
  cursor:pointer;
  box-shadow:0 2px 12px rgba(0,0,0,.45);
}

#skipIntro:active{
  background:#ed1c24;
}

/* MÓVILES */

@media(max-width:600px){

  #controls{
    padding:28px 12px 14px;
  }

  #centerControls{
    gap:20px;
  }

  #centerControls button{
    width:49px;
    height:49px;
    font-size:20px;
  }

  #centerPlay{
    width:66px!important;
    height:66px!important;
    font-size:26px!important;
  }

  .control-row{
    gap:7px;
  }

  .control-row button{
    width:35px;
    height:35px;
    font-size:15px;
  }

  #current,#duration{
    font-size:11px;
  }

  #volume{
    width:55px;
  }

  .volume-group{
    gap:5px;
  }

  #nearEndButtons{
    right:10px;
    bottom:78px;
  }

  #topBar{
    padding:12px 10px 45px;
  }

  #backButton,#topActions button{
    width:35px;
    height:35px;
  }

  #contentTitle{
    font-size:17px;
  }

  #episodeTitle{
    font-size:12px;
  }

  #topActions{
    gap:5px;
  }

  #topActions svg{
    width:19px;
    height:19px;
  }

  #nearEndButtons button{
    font-size:12px;
    padding:10px 14px;
  }

  #skipIntro{
    right:12px;
    bottom:85px;
    padding:10px 15px;
    font-size:13px;
  }

  .end-title{
    font-size:22px;
  }
}

</style>
</head>
<body>
<div id="player">
<video id="video" playsinline preload="metadata"></video>
<iframe id="embedFrame" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>

<div id="posterPreload" aria-hidden="true"><div id="posterPreloadSpinner"></div></div>

<div id="topBar"><div id="topInfo"><button id="backButton" aria-label="Volver">✕</button><div id="episodeInfo"><div id="contentTitle"></div><div id="episodeTitle"></div></div></div>
<div id="topActions">
<button id="pipButton" aria-label="Picture in Picture" title="Picture in Picture"><svg viewBox="0 0 24 24"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v7h-2v-7a.5.5 0 0 0-.5-.5h-13a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5H11v2H5.5A2.5 2.5 0 0 1 3 18V5.5Zm10 7h8v6h-8v-6Zm2 2v2h4v-2h-4Z"></path></svg></button>
<button id="castButton" aria-label="Transmitir a TV" title="Transmitir a TV"><svg viewBox="0 0 24 24"><path d="M3 18v3h3a3 3 0 0 0-3-3Zm0-4v2a5 5 0 0 1 5 5h2c0-3.87-3.13-7-7-7Zm0-4v2c5.52 0 10 4.48 10 10h2c0-6.63-5.37-12-12-12Zm0-5a2 2 0 0 0-2 2v3h2V7h16v10h-7v2h7a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H3Z"></path></svg></button>
</div></div>

<div id="centerControls"><button id="centerBack">↶</button><button id="centerPlay">▶</button><button id="centerForward">↷</button></div>
<div id="seekLeft" class="seek-indicator">−10</div><div id="seekRight" class="seek-indicator">+10</div>

<div id="nearEndButtons"><button id="nearNext">▶ Siguiente episodio</button><button id="nearReplay">↻ Ver otra vez</button></div>

<div id="controls"><div id="progressContainer"><div id="progress"></div><div id="progressThumb"></div></div>
<div class="control-row"><button id="play">▶</button><span id="current">0:00</span><span class="time-separator">/</span><span id="duration">0:00</span>
<div class="volume-group"><button id="mute">🔈</button><input id="volume" type="range" min="0" max="1" step="0.01" value="1"></div><button id="fullscreen">⛶</button></div></div>

<div id="endMessage"><div class="end-box"><div class="end-title">Gracias por ver</div><button id="replayButton">↻ Ver otra vez</button><button id="nextEpisodeButton">▶ Siguiente episodio</button></div></div>
</div>

<script>
const player=document.getElementById("player");
const video=document.getElementById("video");
const embedFrame=document.getElementById("embedFrame");
const controls=document.getElementById("controls");
const centerControls=document.getElementById("centerControls");
const play=document.getElementById("play");
const centerPlay=document.getElementById("centerPlay");
const centerBack=document.getElementById("centerBack");
const centerForward=document.getElementById("centerForward");
const current=document.getElementById("current");
const duration=document.getElementById("duration");
const progress=document.getElementById("progress");
const progressContainer=document.getElementById("progressContainer");
const progressThumb=document.getElementById("progressThumb");
const mute=document.getElementById("mute");
const volume=document.getElementById("volume");
const fullscreen=document.getElementById("fullscreen");
const seekLeft=document.getElementById("seekLeft");
const seekRight=document.getElementById("seekRight");
const endMessage=document.getElementById("endMessage");
const replayButton=document.getElementById("replayButton");
const nextEpisodeButton=document.getElementById("nextEpisodeButton");
const nearEndButtons=document.getElementById("nearEndButtons");
const nearNext=document.getElementById("nearNext");
const nearReplay=document.getElementById("nearReplay");
const posterPreload=document.getElementById("posterPreload");
const topBar=document.getElementById("topBar");
const contentTitle=document.getElementById("contentTitle");
const episodeTitle=document.getElementById("episodeTitle");
const pipButton=document.getElementById("pipButton");
const castButton=document.getElementById("castButton");
const backButton=document.getElementById("backButton");

const PROXY_BASE="http://127.0.0.1:8080";

let videoURL=localStorage.getItem("videoURL");
let serieData=null;

try{
 const guardado=localStorage.getItem("serieData");
 if(guardado) serieData=JSON.parse(guardado);
}catch(error){console.error("Error leyendo serieData:",error)}

let temporadaActual=Number(localStorage.getItem("temporadaActual"));
let episodioActual=Number(localStorage.getItem("episodioActual"));

/* =====================================================
   TIPOS DE FUENTE:
   MP4 / HLS (.m3u8) / EMBED
   ===================================================== */

function detectarTipoFuente(url){
 if(!url) return "none";

 const limpia=url.split("?")[0].toLowerCase();

 if(limpia.endsWith(".m3u8")) return "hls";
 if(limpia.endsWith(".mp4")) return "mp4";

 /* Si el proveedor indica explícitamente embed */
 if(
  url.startsWith("embed:") ||
  url.startsWith("iframe:") ||
  url.includes("embed")
 ) return "embed";

 return "mp4";
}

function limpiarEmbedURL(url){
 return String(url)
  .replace(/^embed:/i,"")
  .replace(/^iframe:/i,"")
  .trim();
}

function obtenerURLReproduccion(url){
 if(!url) return "";

 if(url.includes("yourupload.com")){
  return PROXY_BASE+"/video?url="+encodeURIComponent(url);
 }

 return url;
}

/* =====================================================
   CARGAR FUENTE
   ===================================================== */

function cargarFuente(url){
 if(!url) return;

 const tipo=detectarTipoFuente(url);

 console.log("Tipo de fuente:",tipo);
 console.log("URL original:",url);

 /* Reset */
 video.pause();
 video.removeAttribute("src");
 video.load();
 embedFrame.src="about:blank";
 embedFrame.style.display="none";
 video.style.display="none";

 if(tipo==="embed"){
  const embedURL=limpiarEmbedURL(url);
  console.log("Cargando EMBED:",embedURL);
  embedFrame.src=embedURL;
  embedFrame.style.display="block";
  posterPreload.style.display="none";
  return;
 }

 video.style.display="block";
 posterPreload.style.display="flex";

 const reproduccion=obtenerURLReproduccion(url);

 /*
  MP4:
  El navegador lo reproduce de forma nativa.

  HLS:
  Safari/iOS y algunos navegadores lo soportan
  directamente mediante video.src.

  Para Android/Chrome necesitaremos hls.js cuando
  queramos compatibilidad HLS completa.
 */
 if(tipo==="hls"){
  if(video.canPlayType("application/vnd.apple.mpegurl")){
   video.src=reproduccion;
   video.load();
  }else{
   cargarHLSConJS(reproduccion);
  }
 }else{
  video.src=reproduccion;
  video.load();
 }
}

/* =====================================================
   HLS.JS
   ===================================================== */

let hls=null;

function cargarHLSConJS(url){
 if(typeof Hls==="undefined"){
  console.error("HLS necesita hls.js en este navegador.");
  return;
 }

 if(hls){
  try{hls.destroy()}catch(_){}
  hls=null;
 }

 hls=new Hls({
  enableWorker:true,
  lowLatencyMode:false
 });

 hls.loadSource(url);
 hls.attachMedia(video);

 hls.on(Hls.Events.MANIFEST_PARSED,()=>{
  console.log("HLS cargado correctamente.");
  video.play().catch(()=>{});
 });

 hls.on(Hls.Events.ERROR,(event,data)=>{
  console.error("Error HLS:",data);
 });
}

/* Cargamos hls.js solamente cuando sea necesario */
function cargarLibreriaHLS(){
 if(document.getElementById("hlsScript")) return;

 const script=document.createElement("script");
 script.id="hlsScript";
 script.src="https://cdn.jsdelivr.net/npm/hls.js@latest";
 script.onload=()=>{
  if(videoURL && detectarTipoFuente(videoURL)==="hls"){
   cargarFuente(videoURL);
  }
 };
 script.onerror=()=>{
  console.error("No se pudo cargar hls.js");
 };
 document.head.appendChild(script);
}

/* =====================================================
   INFORMACIÓN SUPERIOR
   ===================================================== */

function cargarInfoSuperior(){
 const tituloSerie=serieData?.title||serieData?.name||localStorage.getItem("contentTitle")||"Ploploxz";
 const temporada=Number(localStorage.getItem("temporadaActual"));
 const episodio=Number(localStorage.getItem("episodioActual"));

 contentTitle.textContent=tituloSerie;

 if(serieData&&Number.isFinite(temporada)&&temporada>0&&Number.isFinite(episodio)&&episodio>0){
  let epTitulo="";
  const season=(serieData.seasons||[]).find(s=>Number(s.season)===temporada);
  const ep=season?.episodes?.find(e=>Number(e.episode)===episodio);
  epTitulo=ep?.title||localStorage.getItem("episodioTitulo")||`Episodio ${episodio}`;
  episodeTitle.textContent=`T${temporada} E${episodio} · ${epTitulo}`;
 }else{
  episodeTitle.textContent="";
 }
}

function tieneEpisodios(){
 return serieData&&Array.isArray(serieData.seasons)&&serieData.seasons.length>0;
}

/* =====================================================
   POSTER
   ===================================================== */

function cargarPoster(){
 const posterURL=localStorage.getItem("posterURL");
 posterPreload.style.display="flex";
 posterPreload.style.visibility="visible";
 posterPreload.classList.remove("hidden");
 posterPreload.style.opacity="1";
 posterPreload.style.pointerEvents="auto";

 posterPreload.style.backgroundImage=posterURL?`url("${posterURL}")`:"none";
}

function ocultarPosterSeguro(){
 posterPreload.classList.add("hidden");
 posterPreload.style.opacity="0";
 posterPreload.style.pointerEvents="none";
}

function ocultarPoster(){ocultarPosterSeguro()}

/* =====================================================
   CARGAR VIDEO
   ===================================================== */

function cargarVideo(){
 videoURL=localStorage.getItem("videoURL");
 cargarInfoSuperior();
 cargarPoster();

 if(!videoURL){
  console.error("No existe videoURL");
  return;
 }

 cargarFuente(videoURL);
}

/* =====================================================
   PROGRESO
   ===================================================== */

function obtenerProgressKey(){
 return "pelicula_"+videoURL;
}

function obtenerLastViewedKey(){
 return obtenerProgressKey()+"_lastViewed";
}

function guardarProgreso(){
 if(!videoURL||!isFinite(video.currentTime)||video.currentTime<=0)return;

 localStorage.setItem(obtenerProgressKey(),String(video.currentTime));
 localStorage.setItem(obtenerLastViewedKey(),String(Date.now()));
}

function formatTime(seconds){
 if(!isFinite(seconds))return "0:00";
 const minutes=Math.floor(seconds/60);
 const secondsLeft=Math.floor(seconds%60);
 return minutes+":"+String(secondsLeft).padStart(2,"0");
}

/* =====================================================
   PLAY / PAUSA
   ===================================================== */

function togglePlay(){
 if(detectarTipoFuente(videoURL)==="embed") return;

 if(video.paused){
  video.play().catch(error=>console.log(error));
 }else{
  video.pause();
 }
}

play.onclick=togglePlay;
centerPlay.onclick=togglePlay;

/* =====================================================
   EVENTOS VIDEO
   ===================================================== */

video.onplay=function(){
 ocultarPosterSeguro();
 play.textContent="❚❚";
 centerPlay.textContent="❚❚";

 if(videoURL) localStorage.setItem(obtenerLastViewedKey(),String(Date.now()));
 showControls();
};

video.addEventListener("playing",ocultarPosterSeguro);
video.addEventListener("canplay",ocultarPosterSeguro);

video.addEventListener("error",function(){
 console.error("Error reproduciendo vídeo:",video.error);
});

video.onpause=function(){
 play.textContent="▶";
 centerPlay.textContent="▶";
 showControls();
};

video.onloadedmetadata=function(){
 duration.textContent=formatTime(video.duration);

 const savedTime=localStorage.getItem(obtenerProgressKey());

 if(savedTime!==null&&Number(savedTime)<video.duration){
  video.currentTime=parseFloat(savedTime);
 }

 updateProgressUI();
};

function updateProgressUI(){
 if(!video.duration)return;

 const percent=Math.max(0,Math.min(100,(video.currentTime/video.duration)*100));
 progress.style.width=percent+"%";
 progressThumb.style.left=percent+"%";
}

video.ontimeupdate=function(){
 current.textContent=formatTime(video.currentTime);
 updateProgressUI();

 if(videoURL&&isFinite(video.currentTime)){
  localStorage.setItem(obtenerProgressKey(),String(video.currentTime));
  localStorage.setItem(obtenerLastViewedKey(),String(Date.now()));
 }

 actualizarSkipIntro();

 if(video.duration&&video.duration-video.currentTime<=100&&video.duration-video.currentTime>0){
  nearEndButtons.classList.add("show");
  updateNearEndButtons();
 }else{
  nearEndButtons.classList.remove("show");
 }
};

/* =====================================================
   SEEK
   ===================================================== */

function seekFromPointer(clientX){
 if(!video.duration)return;

 const rect=progressContainer.getBoundingClientRect();
 let percent=(clientX-rect.left)/rect.width;
 percent=Math.max(0,Math.min(1,percent));

 video.currentTime=percent*video.duration;
 updateProgressUI();
}

let draggingProgress=false;

function progressPointerDown(e){
 draggingProgress=true;
 progressContainer.setPointerCapture?.(e.pointerId);
 seekFromPointer(e.clientX);
 showControls();
 e.preventDefault();
}

function progressPointerMove(e){
 if(!draggingProgress)return;
 seekFromPointer(e.clientX);
 e.preventDefault();
}

function progressPointerUp(e){
 if(!draggingProgress)return;
 draggingProgress=false;

 try{progressContainer.releasePointerCapture?.(e.pointerId)}catch(_){}

 seekFromPointer(e.clientX);
 showControls();
 e.preventDefault();
}

progressContainer.addEventListener("pointerdown",progressPointerDown);
progressContainer.addEventListener("pointermove",progressPointerMove);
progressContainer.addEventListener("pointerup",progressPointerUp);
progressContainer.addEventListener("pointercancel",()=>draggingProgress=false);

/* =====================================================
   INDICADOR SEEK
   ===================================================== */

function showSeekIndicator(element){
 element.classList.remove("show");
 void element.offsetWidth;
 element.classList.add("show");
}

centerBack.onclick=function(){
 if(!video.duration)return;
 video.currentTime=Math.max(0,video.currentTime-10);
 showSeekIndicator(seekLeft);
 showControls();
};

centerForward.onclick=function(){
 if(!video.duration)return;
 video.currentTime=Math.min(video.duration,video.currentTime+10);
 showSeekIndicator(seekRight);
 showControls();
};

/* =====================================================
   VOLUMEN
   ===================================================== */

mute.onclick=function(){
 video.muted=!video.muted;
 mute.textContent=video.muted?"🔇":"🔈";
};

volume.oninput=function(){
 video.volume=Number(volume.value);
 video.muted=false;
 mute.textContent=video.volume===0?"🔇":"🔈";
};

/* =====================================================
   PANTALLA COMPLETA + ORIENTACIÓN HORIZONTAL
   ===================================================== */

fullscreen.onclick=async function(){

 try{

  if(!document.fullscreenElement){

   await player.requestFullscreen();

   if(screen.orientation && screen.orientation.lock){
    await screen.orientation.lock("landscape");
   }

  }else{

   await document.exitFullscreen();

  }

 }catch(error){
  console.log("No se pudo cambiar la orientación:",error);
 }

};

/* Detectar cuando se sale de pantalla completa */
document.addEventListener("fullscreenchange",async()=>{

 if(document.fullscreenElement){

  try{
   if(screen.orientation && screen.orientation.lock){
    await screen.orientation.lock("landscape");
   }
  }catch(error){
   console.log("Bloqueo horizontal no disponible:",error);
  }

 }else{

  try{
   if(screen.orientation && screen.orientation.unlock){
    screen.orientation.unlock();
   }
  }catch(error){}

 }

});
/* =====================================================
   CONTROLES
   ===================================================== */

let timer;

function showControls(){
 controls.classList.remove("hidden");
 centerControls.classList.remove("hidden");
 topBar.classList.remove("hidden");

 clearTimeout(timer);

 if(!video.paused){
  timer=setTimeout(()=>{
   controls.classList.add("hidden");
   centerControls.classList.add("hidden");
   topBar.classList.add("hidden");
  },3000);
 }
}

function hideControls(){
 controls.classList.add("hidden");
 centerControls.classList.add("hidden");
 topBar.classList.add("hidden");
 clearTimeout(timer);
}

video.onclick=function(){
 if(detectarTipoFuente(videoURL)==="embed")return;
 if(draggingProgress)return;

 if(controls.classList.contains("hidden"))showControls();
 else hideControls();
};

/* =====================================================
   PICTURE IN PICTURE
   ===================================================== */
async function entrarPiP(){
 try{
  if(document.pictureInPictureElement){
   await document.exitPictureInPicture();
   return;
  }

  if(document.pictureInPictureEnabled&&video.requestPictureInPicture){
   await video.requestPictureInPicture();
  }
 }catch(error){
  console.log("Picture in Picture no disponible:",error);
 }
}

if(document.pictureInPictureEnabled&&video.requestPictureInPicture){
 pipButton.onclick=entrarPiP;
}else{
 pipButton.classList.add("unsupported");
}

/* =====================================================
   CAST
   ===================================================== */

if("remote" in video&&video.remote){
 castButton.onclick=async()=>{
  try{
   await video.remote.prompt();
  }catch(error){
   console.log("Cast/Remote Playback no disponible:",error);
  }
 };
}else{
 castButton.classList.add("unsupported");
}

/* =====================================================
   VOLVER
   ===================================================== */

backButton.onclick=function(){
 if(history.length>1)history.back();
 else location.href="go:detalle";
};

/* =====================================================
   SALTAR INTRO
   ===================================================== */

const introButton=document.createElement("button");
introButton.id="skipIntro";
introButton.textContent="⏩ Saltar intro";
introButton.style.display="none";
player.appendChild(introButton);


const introStyle=document.createElement("style");
introStyle.textContent=`
#skipIntro{
 position:absolute;
 right:18px;
 bottom:95px;
 z-index:27;
 border:1px solid rgba(255,255,255,.25);
 border-radius:25px;
 padding:12px 18px;
 background:rgba(20,20,20,.88);
 backdrop-filter:blur(10px);
 -webkit-backdrop-filter:blur(10px);
 color:#fff;
 font:bold 14px Arial,sans-serif;
 cursor:pointer;
 box-shadow:0 2px 12px rgba(0,0,0,.45);
}`;
document.head.appendChild(introStyle);


function obtenerEpisodioActual(){
 if(!serieData||!Array.isArray(serieData.seasons))return null;
const temporada=serieData.seasons.find(s=>Number(s.season)===Number(temporadaActual));
 if(!temporada||!Array.isArray(temporada.episodes))return null;

 const episodio=temporada.episodes.find(e=>Number(e.episode)===Number(episodioActual));
 return episodio||null;
}

function actualizarSkipIntro(){
 const episodio=obtenerEpisodioActual();

 if(!episodio){
  introButton.style.display="none";
  return;
 }

 const inicio=Number(episodio.introStart);
 const fin=Number(episodio.introEnd);

 if(!Number.isFinite(inicio)||!Number.isFinite(fin)||fin<=inicio){
  introButton.style.display="none";
  return;
 }

 introButton.style.display=(video.currentTime>=inicio&&video.currentTime<fin)?"block":"none";
}

introButton.onclick=function(){
 const episodio=obtenerEpisodioActual();
 if(!episodio)return;

 const fin=Number(episodio.introEnd);
 if(!Number.isFinite(fin)||fin<=0)return;

 video.currentTime=fin;
 introButton.style.display="none";
 guardarProgreso();
 showControls();
};

/* =====================================================
   SIGUIENTE EPISODIO
   ===================================================== */


function buscarSiguiente(){
 if(!tieneEpisodios())return null;

 const temporadas=[...serieData.seasons].sort((a,b)=>Number(a.season)-Number(b.season));

 const indiceTemporada=temporadas.findIndex(temporada=>Number(temporada.season)===Number(temporadaActual));
 if(indiceTemporada===-1)return null;

 const temporada=temporadas[indiceTemporada];

 const episodios=[...(temporada.episodes||[])].sort((a,b)=>Number(a.episode)-Number(b.episode));

 const indiceEpisodio=episodios.findIndex(episodio=>Number(episodio.episode)===Number(episodioActual));
 if(indiceEpisodio===-1)return null;

 if(indiceEpisodio+1<episodios.length){
  const siguiente=episodios[indiceEpisodio+1];

  if(siguiente.videoUrl){
   return{...siguiente,season:Number(temporada.season)};
  }
 }

 if(indiceTemporada+1<temporadas.length){
  const siguienteTemporada=temporadas[indiceTemporada+1];

  const episodiosSiguiente=[...(siguienteTemporada.episodes||[])].sort((a,b)=>Number(a.episode)-Number(b.episode));

  const primerEpisodio=episodiosSiguiente.find(e=>e.videoUrl);

  if(primerEpisodio){
   return{...primerEpisodio,season:Number(siguienteTemporada.season)};
  }
 }

 return null;
}

function actualizarBoton(){
 const siguiente=buscarSiguiente();

 if(!siguiente){
  nextEpisodeButton.style.display="none";
  nearNext.style.display="none";
  return;
 }
nextEpisodeButton.style.display="block";

 const titulo=siguiente.title||`Episodio ${siguiente.episode}`;
 const texto=`▶ T${siguiente.season}:E${siguiente.episode} · ${titulo}`;

 nextEpisodeButton.textContent=texto;
 nearNext.textContent=texto;
}

function updateNearEndButtons(){
 const siguiente=buscarSiguiente();
 nearNext.style.display=siguiente?"block":"none";
 nearReplay.style.display="block";
}

/* =====================================================
   CARGAR SIGUIENTE
   ===================================================== */

function cargarSiguiente(){
 const siguiente=buscarSiguiente();
 if(!siguiente)return;

 temporadaActual=Number(siguiente.season);
 episodioActual=Number(siguiente.episode);

 const nuevaURL=siguiente.videoUrl;

 localStorage.setItem("temporadaActual",String(temporadaActual));
 localStorage.setItem("episodioActual",String(episodioActual));
 localStorage.setItem("episodioTitulo",siguiente.title||`Episodio ${siguiente.episode}`);
 localStorage.setItem("videoURL",nuevaURL);
 localStorage.setItem("pelicula_"+nuevaURL+"_lastViewed",String(Date.now()));

 videoURL=nuevaURL;

 cargarInfoSuperior();

 endMessage.classList.remove("show");
 nearEndButtons.classList.remove("show");
 cargarPoster();
 introButton.style.display="none";

 cargarFuente(nuevaURL);
 actualizarBoton();
}

nextEpisodeButton.onclick=cargarSiguiente;
nearNext.onclick=cargarSiguiente;

/* =====================================================
   REPETIR
   ===================================================== */

function repetirVideo(){
 localStorage.removeItem(obtenerProgressKey());

 endMessage.classList.remove("show");
 nearEndButtons.classList.remove("show");

 if(detectarTipoFuente(videoURL)==="embed"){
  embedFrame.src=limpiarEmbedURL(videoURL);
  return;
 }

 video.currentTime=0;
 video.play().catch(error=>console.log(error));
}

replayButton.onclick=repetirVideo;
nearReplay.onclick=repetirVideo;

/* =====================================================
   TERMINADO
   ===================================================== */

video.onended=function(){
 nearEndButtons.classList.remove("show");
 introButton.style.display="none";
 actualizarBoton();
 endMessage.classList.add("show");
};

/* =====================================================
   INICIO
   ===================================================== */

video.volume=1;

if(videoURL){
 localStorage.setItem(obtenerLastViewedKey(),String(Date.now()));
}

cargarVideo();

if(videoURL&&detectarTipoFuente(videoURL)==="hls"){
 cargarLibreriaHLS();
}

actualizarBoton();
showControls();
</script>
